<style>

  * { box-sizing: border-box; }

  /* the stage is one 1920 x 1080 viewport of the app; taller screens (the dashboard) scroll inside it.
     --u is one screen pixel in CSS pixels */
  .stage { position: relative; width: min(100%, calc((100vh - 96px) * var(--ar))); aspect-ratio: var(--ar); border-radius: 0; overflow: hidden; background: var(--app); box-shadow: 0 20px 60px rgba(0, 0, 0, .14), 0 0 0 1px rgba(0, 0, 0, .06); user-select: none; -webkit-tap-highlight-color: transparent; }
  .scroller { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; transition: transform .45s cubic-bezier(.4, 0, .2, 1); }
  .screen { position: absolute; left: 0; top: 0; width: 100%; visibility: hidden; pointer-events: none; }
  .screen.on { visibility: visible; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 0; overflow: visible; pointer-events: none; }

  /* sprites: a piece of a screen shown at its own place (or moved) */
  .spr { position: absolute; background-repeat: no-repeat; will-change: transform, opacity; }
  .fill { position: absolute; }

  /* hover targets: a sprite of the element itself, so at rest nothing changes */
  .tg { position: absolute; appearance: none; border: 0; padding: 0; background-color: transparent; background-repeat: no-repeat; pointer-events: auto; cursor: pointer; transition: transform .16s ease; }
  .tg::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: transparent; transition: background-color .16s ease; pointer-events: none; }
  .tg.btn.hover::after, .tg.icon.hover::after { background: rgba(40, 10, 70, .07); }
  .tg.row.hover::after { background: rgba(91, 42, 134, .05); }
  .tg.pri.hover::after { background: rgba(255, 255, 255, .16); }
  .tg.link.hover { transform: translateX(calc(var(--u) * 2)); }
  .tg.bg { cursor: default; }
  .tg.press { transform: scale(.965); transition-duration: .08s; }
  .tg.row.press, .tg.bg.press { transform: none; }
  .tg:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tg.hint { animation: hint .9s ease; }
  @keyframes hint { 0%, 100% { box-shadow: none; } 30% { box-shadow: 0 0 0 calc(var(--u) * 4) rgba(91, 42, 134, .5); } }

  /* the demo cursor and its click ripple (in stage space, not scrolled) */
  .cursor { position: absolute; left: 0; top: 0; width: calc(var(--u) * 40); pointer-events: none; z-index: 5; opacity: 0; transition: opacity .3s; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); will-change: transform; }
  .cursor.on { opacity: 1; }
  .cursor svg { display: block; width: 100%; height: auto; transition: transform .1s ease; transform-origin: 10% 10%; }
  .cursor.down svg { transform: scale(.82); }
  .ripple { position: absolute; width: calc(var(--u) * 70); height: calc(var(--u) * 70); margin: calc(var(--u) * -35) 0 0 calc(var(--u) * -35); border-radius: 50%; background: rgba(91, 42, 134, .3); pointer-events: none; z-index: 4; animation: ripple .5s ease-out forwards; }
  @keyframes ripple { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }

  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; background: var(--app); transition: opacity .3s; pointer-events: none; z-index: 6; }
  .loading.done { opacity: 0; }

  /* controls */
  .bar { display: flex; align-items: center; gap: 14px; width: min(100%, calc((100vh - 96px) * var(--ar))); min-height: 44px; }
  .btn-ui { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--panel); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .btn-ui:hover { background: #f6f6f6; }
  .btn-ui:focus-visible, .dot:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn-ui svg { width: 14px; height: 14px; }
  .btn-ui--icon { width: 40px; padding: 0; justify-content: center; }
  .caption { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caption b { color: var(--ink); font-weight: 500; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .18); cursor: pointer; }
  .dot.on { background: var(--accent); }
  @media (max-width: 700px) { .dots { display: none; } .bar { gap: 8px; } .btn-ui--label span { display: none; } }

  /* ?embed: inside a case study (iframe height = width * 9 / 16 + 58 px): no page background, full width */
  html.embed body { background: transparent; padding: 0; justify-content: flex-start; }
  html.embed .stage, html.embed .bar { width: 100%; }
  html.embed .stage { box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); }
  html.embed .bar { min-height: 44px; height: 44px; }
  .scroller { transition-duration: 1.4s; transition-timing-function: cubic-bezier(.45, 0, .2, 1); }
  #targets .tg { pointer-events: none; cursor: default; }
  .stage { cursor: default; }

  function go(b, keep) {

    var leave = !keep && scrollY > 0 ? 450 : 0;   // back to the top of a scrolled screen first (not for in-page states)

  // ---- the demo cursor ----------------------------------------------------------------------------

        var r = document.createElement('div');
        r.className = 'ripple'; r.style.left = px(a[0]); r.style.top = px(a[1]);
        stage.appendChild(r); setTimeout(function () { r.remove(); }, 600);
        timer = setTimeout(function () { cursor.classList.remove('down'); if (t) t.classList.remove('press'); go(INDEX[l.to], l.keep); }, 140);
      }, 220);
    });
  }

  function setPlayLabel() {
    playBtn.innerHTML = playing
      ? '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg><span>Pause demo</span>'
      : '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.2v11.6c0 .6.7 1 1.2.7l9-5.8c.5-.3.5-1 0-1.3l-9-5.9C4.7 1.2 4 1.6 4 2.2z"/></svg><span>Play demo</span>';

  }
  function pause() {
    playing = false; cursor.classList.remove('on', 'down'); setPlayLabel();
    Array.prototype.forEach.call(tgs.children, function (e) { e.classList.remove('hover', 'press'); });
    if (!busy) clearTimeout(timer);
  }
  function play() { playing = true; setPlayLabel(); if (!busy) { clearTimeout(timer); timer = setTimeout(demoClick, 300); } }

  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('restart').addEventListener('click', function () { cur = { x: W * .78, y: VH * .83 }; cursor.style.transform = 'translate(' + W * .78 * u + 'px,' + VH * .83 * u + 'px)'; jump(0); });
  
  document.addEventListener('keydown', function (e) {
