  function pause() { if (!playing) return; playing = false; clearTimeout(timer); cursor.classList.remove('on', 'down'); setPlayLabel(); }
  function play() { playing = true; setPlayLabel(); cursor.classList.add('on'); demo(ORDER.indexOf(current)); }
  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('restart').addEventListener('click', function () {   // first mode, sliders back where they started
    var was = playing; pause();
    Object.keys(modes).forEach(function (k) { modes[k].rows.forEach(function (row) { set(row, row.r.frac); }); });
    loop = 0; show('CCT'); if (was || !still) play();
  });
  var setU = function () { u = stage.clientWidth / W; stage.style.setProperty('--u', u + 'px'); };
  window.addEventListener('resize', setU);
  setU(); setPlayLabel();
  show('CCT');
  // preload the other modes after the first one
  setTimeout(function () { ORDER.forEach(loadMode); }, 600);
  if (playing) { cursor.classList.add('on'); cursor.style.transform = 'translate(' + cur.x * u + 'px,' + cur.y * u + 'px)'; timer = setTimeout(function () { demo(0); }, 900); }
})();
</script>
</body>
</html>
