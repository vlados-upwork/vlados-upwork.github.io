<style>
  @font-face { font-family: 'SF Pro Display'; font-weight: 400; font-display: swap; src: url(../../fonts/SFProDisplay-Regular.75a6f5d.woff2) format('woff2'); }
  @font-face { font-family: 'SF Pro Display'; font-weight: 500; font-display: swap; src: url(../../fonts/SFProDisplay-Medium.48749ab.woff2) format('woff2'); }
  :root { --ink: #111; --muted: #6b6b6b; --accent: #5b2a86; --bg: #e9e8e5; --panel: #fff; --app: #f4f3f7; --u: 0.5px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.3 'SF Pro Display', system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }

  /* the stage is one 1920 x 1080 viewport of the app; taller screens (the dashboard) scroll inside it.
     --u is one screen pixel in CSS pixels */
  .stage { position: relative; width: min(100%, calc((100vh - 96px) * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 0; overflow: hidden; background: var(--app); box-shadow: 0 20px 60px rgba(0, 0, 0, .14), 0 0 0 1px rgba(0, 0, 0, .06); user-select: none; -webkit-tap-highlight-color: transparent; }
  .scroller { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; transition: transform .45s cubic-bezier(.4, 0, .2, 1); }
  .screen { position: absolute; left: 0; top: 0; width: 100%; visibility: hidden; pointer-events: none; }
  .screen.on { visibility: visible; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 0; overflow: visible; pointer-events: none; }

  /* sprites: a piece of a screen shown at its own place (or moved) */
  .spr { position: absolute; background-repeat: no-repeat; will-change: transform, opacity; }
  .fill { position: absolute; }

  /* hover targets: a sprite of the element itself, so at rest nothing changes */
  .tg { position: absolute; appearance: none; border: 0; padding: 0; background-color: transparent; background-repeat: no-repeat; pointer-events: auto; cursor: pointer; transition: transform .16s ease; }
  .tg::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: transparent; transition: background-color .16s ease; pointer-events: none; }
  .tg.btn.hover::after, .tg.icon.hover::after { background: rgba(40, 10, 70, .07); }
  .tg.row.hover::after { background: rgba(91, 42, 134, .05); }
  .tg.pri.hover::after { background: rgba(255, 255, 255, .16); }
  .tg.link.hover { transform: translateX(calc(var(--u) * 2)); }
  .tg.bg { cursor: default; }
  .tg.press { transform: scale(.965); transition-duration: .08s; }
  .tg.row.press, .tg.bg.press { transform: none; }
  .tg:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tg.hint { animation: hint .9s ease; }
  @keyframes hint { 0%, 100% { box-shadow: none; } 30% { box-shadow: 0 0 0 calc(var(--u) * 4) rgba(91, 42, 134, .5); } }

  .cursor { position: absolute; left: 0; top: 0; width: calc(var(--u) * 40); pointer-events: none; z-index: 5; opacity: 0; transition: opacity .3s; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); will-change: transform; }
  .cursor.on { opacity: 1; }
  .cursor svg { display: block; width: 100%; height: auto; transition: transform .1s ease; transform-origin: 10% 10%; }
  .cursor.down svg { transform: scale(.82); }
  .ripple { position: absolute; width: calc(var(--u) * 70); height: calc(var(--u) * 70); margin: calc(var(--u) * -35) 0 0 calc(var(--u) * -35); border-radius: 50%; background: rgba(91, 42, 134, .3); pointer-events: none; z-index: 4; animation: ripple .5s ease-out forwards; }
  @keyframes ripple { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }

  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; background: var(--app); transition: opacity .3s; pointer-events: none; z-index: 6; }
  .loading.done { opacity: 0; }

  /* controls */
  .bar { display: flex; align-items: center; gap: 14px; width: min(100%, calc((100vh - 96px) * 16 / 9)); min-height: 44px; }
  .btn-ui { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--panel); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .btn-ui:hover { background: #f6f6f6; }
  .btn-ui:focus-visible, .dot:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn-ui svg { width: 14px; height: 14px; }
  .btn-ui--icon { width: 40px; padding: 0; justify-content: center; }
  .caption { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caption b { color: var(--ink); font-weight: 500; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .18); cursor: pointer; }
  .dot.on { background: var(--accent); }
  @media (max-width: 700px) { .dots { display: none; } .bar { gap: 8px; } .btn-ui--label span { display: none; } }

  html.embed body { background: transparent; padding: 0; justify-content: flex-start; }
  html.embed .stage, html.embed .bar { width: 100%; }

  html.embed .bar { min-height: 44px; height: 44px; }

  stage.addEventListener('wheel', function (e) {
    var m = maxScroll();
    if (!m || busy) return;
    var y = Math.max(0, Math.min(m, scrollY + e.deltaY / u));
    if (y !== scrollY) { e.preventDefault(); scrollY = y; applyScroll(false); }
  }, { passive: false });

  function builder(layer, a, b, anims) {
    return {
      A: a, B: b,
      ty: function (v) { return 'translateY(' + v * u + 'px)'; },
      tx: function (v) { return 'translateX(' + v * u + 'px)'; },
      fill: function (r, color) { var e = document.createElement('div'); e.className = 'fill'; place(e, r); e.style.background = color; layer.appendChild(e); return e; },
      spr: function (k, r) { var e = document.createElement('div'); e.className = 'spr'; place(e, r); bgFor(e, k, r); layer.appendChild(e); return e; },
      a: function (el, frames, dur, delay, easing) {
        anims.push(el.animate(frames, { duration: still ? 1 : dur, delay: still ? 0 : (delay || 0), easing: easing || EASE, fill: 'both' }));
      },
    };
  }

  function showBase(k) {
    imgs.forEach(function (img, i) { img.classList.toggle('on', i === k); });
    imgs[k].style.height = px(STEPS[k].h);
  }

  function buildTargets(k) {
    tgs.innerHTML = '';
    var s = STEPS[k];
    s.links.forEach(function (l) {
      var demo = l.element === s.demo, kind = kindOf(l);
      var e = document.createElement(kind === 'bg' ? 'div' : 'button');
      e.className = 'tg ' + kind; place(e, l.rect);
      e.style.borderRadius = px(kind === 'row' || kind === 'bg' ? 0 : kind === 'icon' ? 8 : 6);
      if (kind !== 'bg') { bgFor(e, k, l.rect); e.type = 'button'; e.setAttribute('aria-label', l.element.replace(/^(Button|Nav|Row|Icon) \/ /, '').replace(/ \(hover\)$/, '')); }
      if (demo) e.dataset.demo = '1';
      e.addEventListener('pointerenter', function () { e.classList.add('hover'); });
      e.addEventListener('pointerleave', function () { e.classList.remove('hover', 'press'); });
      e.addEventListener('pointerdown', function () { e.classList.add('press'); });
      e.addEventListener('pointerup', function () { e.classList.remove('press'); });
      e.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (busy) return;
        if (playing) pause();
        go(INDEX[l.to]);
      });
      tgs.appendChild(e);
    });
  }
  function hint() {
    var h = tgs.querySelector('[data-demo]');
    if (h) { h.classList.remove('hint'); void h.offsetWidth; h.classList.add('hint'); }
  }

  function settle(k) {
    current = k;
    showBase(k);
    frame(function () { fx.innerHTML = ''; });
    amb.innerHTML = '';
    var s = STEPS[k];
    buildTargets(k);
    dots.forEach(function (d, i) { d.classList.toggle('on', i === k); d.setAttribute('aria-current', i === k ? 'step' : 'false'); });
    caption.innerHTML = '<b>' + (k + 1) + ' / ' + STEPS.length + ' · ' + s.part + '</b> &nbsp;' + s.label;
    load((k + 1) % STEPS.length);
    clearTimeout(timer);
    if (playing) timer = setTimeout(demoClick, s.dwell || READ);
  }

  function jump(k) {
    clearTimeout(timer); fx.innerHTML = ''; scrollY = 0; applyScroll(false);
    load(k).then(function () {
      settle(k);
      var l = document.getElementById('loading');
      if (l) { l.classList.add('done'); setTimeout(function () { l.remove(); }, 400); }
    });
  }

  function go(b) {
    if (busy || b === undefined) return;
    var a = current;
    busy = true; clearTimeout(timer);
    tgs.innerHTML = ''; amb.innerHTML = '';
    var leave = scrollY > 0 ? 450 : 0;           // back to the top of a scrolled screen first
    scrollY = 0; applyScroll(true);
    Promise.all([load(a), load(b), new Promise(function (r) { setTimeout(r, leave); })]).then(function () {
      var anims = [];
      fx.innerHTML = '';
      var t = TRANS[STEPS[a].id + '>' + STEPS[b].id] || dissolve;
      var dur = t(builder(fx, a, b, anims));
      setTimeout(function () { busy = false; settle(b); }, still ? 10 : dur);
    });
  }

  // ---- the demo cursor ----------------------------------------------------------------------------
  function hoverAt(x, y) {
    Array.prototype.forEach.call(tgs.children, function (e) {
      if (e.classList.contains('bg')) return;
      var l = e.offsetLeft / u, t = e.offsetTop / u, inside = x >= l && x <= l + e.offsetWidth / u && y >= t && y <= t + e.offsetHeight / u;
      e.classList.toggle('hover', inside);
    });
  }
  function moveTo(x, y, ms, done) {
    var x0 = cur.x, y0 = cur.y, t0 = performance.now();
    var cx = (x0 + x) / 2 + (y - y0) * .18, cy = (y0 + y) / 2 - (x - x0) * .18;
    (function step(now) {
      var p = Math.min(1, (now - t0) / ms), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      var bx = (1 - e) * (1 - e) * x0 + 2 * (1 - e) * e * cx + e * e * x, by = (1 - e) * (1 - e) * y0 + 2 * (1 - e) * e * cy + e * e * y;
      cur = { x: bx, y: by };
      cursor.style.transform = 'translate(' + bx * u + 'px,' + by * u + 'px)';
      hoverAt(bx, by + scrollY);
      if (p < 1) frame(step); else done();
    })(t0);
  }
  function demoClick() {
    if (!playing || busy) return;
    if (!visible || document.hidden) { timer = setTimeout(demoClick, 500); return; }
    var s = STEPS[current], l = s.links.filter(function (x) { return x.element === s.demo; })[0];
    var a = [(l.rect[0] + l.rect[2]) / 2, (l.rect[1] + l.rect[3]) / 2 - scrollY];
    cursor.classList.add('on');
    moveTo(a[0], a[1], Math.max(450, Math.min(1100, Math.hypot(a[0] - cur.x, a[1] - cur.y) * 1.1)), function () {
      if (!playing) return;
      timer = setTimeout(function () {
        var t = tgs.querySelector('[data-demo]');
        cursor.classList.add('down'); if (t) t.classList.add('press');
        var r = document.createElement('div');
        r.className = 'ripple'; r.style.left = px(a[0]); r.style.top = px(a[1]);
        stage.appendChild(r); setTimeout(function () { r.remove(); }, 600);
        timer = setTimeout(function () { cursor.classList.remove('down'); if (t) t.classList.remove('press'); go(INDEX[l.to]); }, 140);
      }, 220);
    });
  }

  function setPlayLabel() {
    playBtn.innerHTML = playing
      ? '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg><span>Pause demo</span>'
      : '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.2v11.6c0 .6.7 1 1.2.7l9-5.8c.5-.3.5-1 0-1.3l-9-5.9C4.7 1.2 4 1.6 4 2.2z"/></svg><span>Play demo</span>';
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function pause() {
    playing = false; cursor.classList.remove('on', 'down'); setPlayLabel();
    Array.prototype.forEach.call(tgs.children, function (e) { e.classList.remove('hover', 'press'); });
    if (!busy) clearTimeout(timer);
  }
  function play() { playing = true; setPlayLabel(); if (!busy) { clearTimeout(timer); timer = setTimeout(demoClick, 300); } }

  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('restart').addEventListener('click', function () { cur = { x: 1500, y: 900 }; cursor.style.transform = 'translate(' + 1500 * u + 'px,' + 900 * u + 'px)'; jump(0); });
  stage.addEventListener('click', function () { if (playing) { pause(); return; } hint(); });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('button')) return;
    if (e.key === 'ArrowRight') { pause(); go((current + 1) % STEPS.length); }
    else if (e.key === 'ArrowLeft') { pause(); jump((current - 1 + STEPS.length) % STEPS.length); }
    else if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  });
  window.addEventListener('resize', function () { setU(); cursor.style.transform = 'translate(' + cur.x * u + 'px,' + cur.y * u + 'px)'; });
  if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(stage);

  setU();
  setPlayLabel();
  cursor.style.transform = 'translate(' + 1500 * u + 'px,' + 900 * u + 'px)';
  jump(0);
})();
</script>
</body>
</html>
