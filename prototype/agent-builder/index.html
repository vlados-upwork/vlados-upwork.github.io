        e.style.backgroundImage = 'url(' + src(k) + ')'; e.style.backgroundPosition = px(-r[0]) + ' ' + px(-r[1]);
        layer.appendChild(e); return e;
      },
      a: function (el, frames, dur, delay, easing, origin) {

        anims.push(el.animate(frames, { duration: still ? 1 : dur, delay: still ? 0 : (delay || 0), easing: easing || EASE, fill: 'both' }));
      },
      clip: function (t, r, b, l) { return 'inset(' + t * u + 'px ' + r * u + 'px ' + b * u + 'px ' + l * u + 'px)'; },
      extra: function (k) { return src(k).replace(STEPS[k].id + '-', STEPS[k].extra + '-'); },
      sprUrl: function (url, r) {
        var e = document.createElement('div');
        e.className = 'spr'; place(e, r);
        e.style.backgroundImage = 'url(' + url + ')'; e.style.backgroundPosition = px(-r[0]) + ' ' + px(-r[1]);
        layer.appendChild(e); return e;
      },
      // a new page: the next screen fades in, with canvas over the areas whose content rises in separately
      page: function () {

        els.forEach(function (e) { self.a(e, [{ opacity: 0 }, { opacity: 1 }], 300, 60, EASE); });
      },
      rise: function (el, delay) { this.a(el, [{ opacity: 0, transform: this.ty(18) }, { opacity: 1, transform: 'none' }], 420, delay, OUT); },
    };
  }

  function showBase(k) { imgs.forEach(function (img, i) { img.classList.toggle('on', i === k); }); }

  function buildTargets(k) {
    tgs.innerHTML = '';
    var s = STEPS[k], list = (s.go ? [s.go] : []).concat(s.t || []);
    list.forEach(function (t, n) {
      var e = document.createElement(n === 0 && s.go ? 'button' : 'div');
      // a card lifts as a whole: 2 px of canvas around it, so no sliver of its border stays behind
      if (t.kind === 'card') t = { kind: t.kind, rad: (t.rad || 6) + 2, r: [t.r[0] - 2, t.r[1] - 2, t.r[2] + 2, t.r[3] + 2] };
      e.className = 'tg ' + t.kind; place(e, t.r);
      e.style.borderRadius = px(t.rad || 6);
      if (t.kind === 'card') {
        var face = document.createElement('div');
        face.className = 'face';
        face.style.backgroundImage = 'url(' + src(k) + ')'; face.style.backgroundPosition = px(-t.r[0]) + ' ' + px(-t.r[1]);
        e.style.backgroundPosition = px(-t.r[0]) + ' ' + px(-t.r[1]);   // the canvas dots, aligned with the page
        e.appendChild(face);
      } else {
        e.style.backgroundImage = 'url(' + src(k) + ')'; e.style.backgroundPosition = px(-t.r[0]) + ' ' + px(-t.r[1]);
      }
      if (n === 0 && s.go) { e.type = 'button'; e.setAttribute('aria-label', s.label); e.style.border = '0'; e.style.padding = '0'; e.dataset.go = '1'; }
      e.addEventListener('pointerenter', function () { e.classList.add('hover'); });
      e.addEventListener('pointerleave', function () { e.classList.remove('hover', 'press'); });
      e.addEventListener('pointerdown', function () { e.classList.add('press'); });
      e.addEventListener('pointerup', function () { e.classList.remove('press'); });
      e.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (busy) return;
        if (playing) pause();
        if (e.dataset.go) advance(); else hint();
      });
      tgs.appendChild(e);
    });
  }
  function hint() {
    var h = tgs.querySelector('[data-go]');
    if (h) { h.classList.remove('hint'); void h.offsetWidth; h.classList.add('hint'); }
  }

  function settle(k) {   // a screen is now fully shown: targets, caption, ambient effects, what happens next
    current = k;
    showBase(k);
    frame(function () { fx.innerHTML = ''; });
    amb.innerHTML = '';
    var s = STEPS[k];
    buildTargets(k);
    dots.forEach(function (d, i) { d.classList.toggle('on', i === k); d.setAttribute('aria-current', i === k ? 'step' : 'false'); });
    caption.innerHTML = '<b>' + (k + 1) + ' / ' + STEPS.length + ' · ' + s.part + '</b> &nbsp;' + s.label;
    if (AMBIENT[s.id] && !still) AMBIENT[s.id](builder(amb, k, k, []));
    load((k + 1) % STEPS.length);
    clearTimeout(timer);
    if (s.auto) timer = setTimeout(advance, s.auto);
    else if (playing) timer = setTimeout(demoClick, s.dwell || READ);
  }

  function jump(k) {   // no transition (dots, restart)
    clearTimeout(timer); fx.innerHTML = '';
    load(k).then(function () {
      settle(k);
      var l = document.getElementById('loading');
      if (l) { l.classList.add('done'); setTimeout(function () { l.remove(); }, 400); }
    });
  }

  function advance() {
    if (busy) return;
    var a = current, b = (current + 1) % STEPS.length;
    busy = true; clearTimeout(timer);
    tgs.innerHTML = ''; amb.innerHTML = '';
    Promise.all([load(a), load(b)]).then(function () {
      var anims = [];
      fx.innerHTML = '';
      var dur = TRANS[a](builder(fx, a, b, anims));
      setTimeout(function () { busy = false; settle(b); }, still ? 10 : dur);
    });
  }

  // ---- the demo cursor: glides along a gentle curve, hovering what it passes over ----------------
  function hoverAt(x, y) {
    Array.prototype.forEach.call(tgs.children, function (e) {
      var l = e.offsetLeft / u, t = e.offsetTop / u, inside = x >= l && x <= l + e.offsetWidth / u && y >= t && y <= t + e.offsetHeight / u;
      e.classList.toggle('hover', inside);
    });
  }
  function moveTo(x, y, ms, done) {
    var x0 = cur.x, y0 = cur.y, t0 = performance.now();
    var cx = (x0 + x) / 2 + (y - y0) * .18, cy = (y0 + y) / 2 - (x - x0) * .18;   // control point: a slight arc
    (function step(now) {
      var p = Math.min(1, (now - t0) / ms), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      var bx = (1 - e) * (1 - e) * x0 + 2 * (1 - e) * e * cx + e * e * x, by = (1 - e) * (1 - e) * y0 + 2 * (1 - e) * e * cy + e * e * y;
      cur = { x: bx, y: by };
      cursor.style.transform = 'translate(' + bx * u + 'px,' + by * u + 'px)';
      hoverAt(bx, by);
      if (p < 1) frame(step); else done();
    })(t0);
  }
  function demoClick() {
    if (!playing || busy) return;
    if (!visible || document.hidden) { timer = setTimeout(demoClick, 500); return; }
    var s = STEPS[current], g = s.go.r, a = s.aim || [(g[0] + g[2]) / 2, (g[1] + g[3]) / 2];
    cursor.classList.add('on');
    var d = Math.hypot(a[0] - cur.x, a[1] - cur.y);
    moveTo(a[0], a[1], Math.max(450, Math.min(1100, d * 1.1)), function () {
      if (!playing) return;
      timer = setTimeout(function () {
        var go = tgs.querySelector('[data-go]');
        cursor.classList.add('down'); if (go) go.classList.add('press');
        var r = document.createElement('div');
        r.className = 'ripple'; r.style.left = px(a[0]); r.style.top = px(a[1]);
        stage.appendChild(r); setTimeout(function () { r.remove(); }, 600);
        timer = setTimeout(function () { cursor.classList.remove('down'); if (go) go.classList.remove('press'); advance(); }, 140);
      }, 220);
    });
  }

  function setPlayLabel() {
    playBtn.innerHTML = playing
      ? '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg><span>Pause demo</span>'
      : '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.2v11.6c0 .6.7 1 1.2.7l9-5.8c.5-.3.5-1 0-1.3l-9-5.9C4.7 1.2 4 1.6 4 2.2z"/></svg><span>Play demo</span>';
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function pause() {
    playing = false; cursor.classList.remove('on', 'down'); setPlayLabel();
    Array.prototype.forEach.call(tgs.children, function (e) { e.classList.remove('hover', 'press'); });
    if (!busy && !(STEPS[current] && STEPS[current].auto)) clearTimeout(timer);
  }
  function play() { playing = true; setPlayLabel(); if (!busy && !STEPS[current].auto) { clearTimeout(timer); timer = setTimeout(demoClick, 300); } }

  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('restart').addEventListener('click', function () { cur = { x: 1500, y: 1000 }; cursor.style.transform = 'translate(' + 1500 * u + 'px,' + 1000 * u + 'px)'; jump(0); });
  stage.addEventListener('click', function () { if (playing) { pause(); return; } hint(); });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('button')) return;
    if (e.key === 'ArrowRight') { pause(); advance(); }
    else if (e.key === 'ArrowLeft') { pause(); jump((current - 1 + STEPS.length) % STEPS.length); }
    else if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  });
  window.addEventListener('resize', function () { setU(); cursor.style.transform = 'translate(' + cur.x * u + 'px,' + cur.y * u + 'px)'; });
  if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(stage);

  setPlayLabel();
  cursor.style.transform = 'translate(' + 1500 * u + 'px,' + 1000 * u + 'px)';
  jump(0);
})();
