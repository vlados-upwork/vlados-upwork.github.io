<style>

    if (!playing || busy) return;
    if (!visible || document.hidden) { timer = setTimeout(demoClick, 500); return; }
    var s = STEPS[current], l = s.links.filter(function (x) { return x.element === demoOf(s); })[0];
    if (s.demo && s.demo.auto) { go(INDEX[s.demo.auto]); return; }
    if (!l) { pause(); return; }
    var cy = (l.rect[1] + l.rect[3]) / 2;
    var want = Math.max(0, Math.min(maxScroll(), cy - VH / 2));
    if ((cy - scrollY < 90 || cy - scrollY > VH - 90) && Math.abs(want - scrollY) > 4) { scrollY = want; applyScroll(true); timer = setTimeout(demoClick, D.scrollMs); return; }
    var a = [(l.rect[0] + l.rect[2]) / 2, cy - scrollY];
    cursor.classList.add('on');
    moveTo(a[0], a[1], Math.max(450, Math.min(1100, Math.hypot(a[0] - cur.x, a[1] - cur.y) * 1.1)), function () {
      if (!playing) return;
      timer = setTimeout(function () {
        var t = tgs.querySelector('[data-demo]');
        cursor.classList.add('down'); if (t) t.classList.add('press');
        var r = document.createElement('div');
        r.className = 'ripple'; r.style.left = px(a[0]); r.style.top = px(a[1]);
        stage.appendChild(r); setTimeout(function () { r.remove(); }, 600);
        timer = setTimeout(function () { cursor.classList.remove('down'); if (t) t.classList.remove('press'); go(INDEX[l.to], l.keep); }, 140);
      }, 220);
    });
  }

  function setPlayLabel() {
    playBtn.innerHTML = playing
      ? '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg><span>Pause demo</span>'
      : '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.2v11.6c0 .6.7 1 1.2.7l9-5.8c.5-.3.5-1 0-1.3l-9-5.9C4.7 1.2 4 1.6 4 2.2z"/></svg><span>Play demo</span>';
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function pause() {
    playing = false; cursor.classList.remove('on', 'down'); setPlayLabel();
    Array.prototype.forEach.call(tgs.children, function (e) { e.classList.remove('hover', 'press'); });
    if (!busy) clearTimeout(timer);
  }
  function play() { playing = true; setPlayLabel(); if (!busy) { clearTimeout(timer); timer = setTimeout(demoClick, 300); } }

  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('restart').addEventListener('click', function () { cur = { x: W * .78, y: VH * .83 }; cursor.style.transform = 'translate(' + W * .78 * u + 'px,' + VH * .83 * u + 'px)'; jump(0); });
  stage.addEventListener('click', function () { if (playing) { pause(); return; } hint(); });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('button')) return;
    if (e.key === 'ArrowRight') { pause(); go((current + 1) % STEPS.length); }
    else if (e.key === 'ArrowLeft') { pause(); jump((current - 1 + STEPS.length) % STEPS.length); }
    else if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  });
  window.addEventListener('resize', function () { setU(); cursor.style.transform = 'translate(' + cur.x * u + 'px,' + cur.y * u + 'px)'; });
  if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(stage);

  setU();
  setPlayLabel();
  cursor.style.transform = 'translate(' + W * .78 * u + 'px,' + VH * .83 * u + 'px)';
  jump(0);
})();
</script>
</body>
