<style>
  @font-face { font-family: 'SF Pro Display'; font-weight: 400; font-display: swap; src: url(../../fonts/SFProDisplay-Regular.75a6f5d.woff2) format('woff2'); }
  @font-face { font-family: 'SF Pro Display'; font-weight: 500; font-display: swap; src: url(../../fonts/SFProDisplay-Medium.48749ab.woff2) format('woff2'); }
  :root { --ink: #0d0d12; --muted: #6b6b7e; --bg: #e9e8e5; --panel: #fff; --u: 0.5px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.3 'SF Pro Display', system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }

  /* the stage is one 1912 x 1266 screen of the app; --u is one screen pixel in CSS pixels */
  .stage { position: relative; width: min(100%, calc((100vh - 96px) * 1912 / 1266)); aspect-ratio: 1912 / 1266; border-radius: 0; overflow: hidden; background: #f7f7f8; box-shadow: 0 20px 60px rgba(0, 0, 0, .14), 0 0 0 1px rgba(0, 0, 0, .06); user-select: none; -webkit-tap-highlight-color: transparent; }
  .scr { position: absolute; inset: 0; }
  .scr > img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .strip { position: absolute; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: #d4d4d4 transparent; overscroll-behavior-x: contain; background: #fff; }
  .strip::-webkit-scrollbar { height: calc(var(--u) * 6); }
  .strip::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 99px; }
  .strip-in { position: relative; }
  .strip-in > img { display: block; height: auto; }
  .tl { position: absolute; left: 0; top: 0; width: 100%; height: 0; overflow: visible; }

  /* hotspots: nothing changes at rest; hover tints like the app's own hover states */
  .tg { position: absolute; appearance: none; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: calc(var(--u) * 8); transition: background-color .12s ease, box-shadow .12s ease; }
  .tg:hover, .tg.hover { background: rgba(13, 13, 18, .05); }
  .tg.row { border-radius: 0; }
  .tg.cell { border-radius: calc(var(--u) * 6); }
  .tg.cell:hover, .tg.cell.hover { background: transparent; box-shadow: 0 0 0 calc(var(--u) * 2) #0d0d12; }
  .tg.press { transform: scale(.97); }
  .tg:focus-visible { outline: 3px solid #7132f5; outline-offset: 2px; }
  .tg.hint { animation: hint .9s ease; }
  @keyframes hint { 0%, 100% { box-shadow: none; } 30% { box-shadow: 0 0 0 calc(var(--u) * 4) rgba(113, 50, 245, .45); } }

  /* dropdown menus: an image of the open menu over a transparent layer that closes it */
  .veil { position: absolute; inset: 0; z-index: 3; }
  .menu { position: absolute; z-index: 4; }
  .menu > img { display: block; width: 100%; height: 100%; }
  .menu .tg { border-radius: calc(var(--u) * 6); }
  .tg.trig { z-index: 5; }   /* above the closing layer, so another menu button switches menus in one click */
  .trig.open { background: rgba(13, 13, 18, .05); }

  .cursor { position: absolute; left: 0; top: 0; width: calc(var(--u) * 40); pointer-events: none; z-index: 8; opacity: 0; transition: opacity .3s; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); will-change: transform; }
  .cursor.on { opacity: 1; }
  .cursor svg { display: block; width: 100%; height: auto; transition: transform .1s ease; transform-origin: 10% 10%; }
  .cursor.down svg { transform: scale(.82); }
  .ripple { position: absolute; width: calc(var(--u) * 70); height: calc(var(--u) * 70); margin: calc(var(--u) * -35) 0 0 calc(var(--u) * -35); border-radius: 50%; background: rgba(13, 13, 18, .22); pointer-events: none; z-index: 7; animation: ripple .5s ease-out forwards; }
  @keyframes ripple { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; background: #f7f7f8; transition: opacity .3s; pointer-events: none; z-index: 9; }
  .loading.done { opacity: 0; }

  .bar { display: flex; align-items: center; gap: 14px; width: min(100%, calc((100vh - 96px) * 1912 / 1266)); min-height: 44px; }
  .btn-ui { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--panel); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .btn-ui:hover { background: #f6f6f6; }
  .btn-ui:focus-visible, .dot:focus-visible { outline: 3px solid #7132f5; outline-offset: 2px; }
  .btn-ui svg { width: 14px; height: 14px; }
  .btn-ui--icon { width: 40px; padding: 0; justify-content: center; }
  .caption { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caption b { color: var(--ink); font-weight: 500; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .18); cursor: pointer; }
  .dot.on { background: var(--ink); }
  @media (max-width: 700px) { .dots { display: none; } .bar { gap: 8px; } .btn-ui--label span { display: none; } }

  html.embed body { background: transparent; padding: 0; justify-content: flex-start; }
  html.embed .stage, html.embed .bar { width: 100%; }
  html.embed .stage { box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); }
  html.embed .bar { min-height: 44px; height: 44px; }
</style>
