  .stage { position: relative; width: min(100%, calc((100vh - 96px) * 1912 / 1266)); aspect-ratio: 1912 / 1266; border-radius: 0; overflow: hidden; background: var(--app); box-shadow: 0 20px 60px rgba(0, 0, 0, .14), 0 0 0 1px rgba(0, 0, 0, .06); user-select: none; -webkit-tap-highlight-color: transparent; }

      b.addEventListener('click', function (ev) { ev.stopPropagation(); if (busy) return; if (playing) pause(); go(BY[l.to]); });
      (l.layer === 'doc' ? o.dl : o.cl).appendChild(b);
      l.el = b;
    });
    stage.insertBefore(el, cursor);
    return o;
  }
  // the image elements resolve their currentSrc once loaded: keep one per layer for the sprites
  function remember(o) {
    var imgs = o.el.querySelectorAll('img');
    Array.prototype.forEach.call(imgs, function (img) {
      var L = img.classList.contains('chrome') ? o.s.chrome : o.s.doc;
      if (img.complete) cache[L.img + ':img'] = img; else img.addEventListener('load', function () { cache[L.img + ':img'] = img; });
    });
  }

  var scrollOf = function (o) { return o && o.wrap ? o.wrap.scrollTop / u : 0; };
  var maxScroll = function (o) { return o.wrap ? Math.max(0, DOCY + o.s.doc.h - VH) : 0; };
  function scrollTo(o, y, ms, done) {   // eased scroll of the story, in screen px
    if (!o.wrap) { if (done) done(); return; }
    y = Math.max(0, Math.min(maxScroll(o), y));
    var y0 = scrollOf(o), t0 = performance.now();
    if (Math.abs(y - y0) < 2 || still) { o.wrap.scrollTop = y * u; if (done) done(); return; }
    (function step(now) {
      var p = Math.min(1, (now - t0) / ms), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      o.wrap.scrollTop = (y0 + (y - y0) * e) * u;
      if (p < 1) frame(step); else if (done) done();
    })(t0);
  }
  // where a new block should sit: its top a little under the header, or the whole block if it fits
  var reveal = function (s) { var r = s.fresh; return r[1] - 90 + Math.min(0, VH - DOCY - 90 - (r[3] - r[1]) - 60); };

  function settle(o) {
    var k = o.i, s = o.s;
    current = k; cur = o;
    dots.forEach(function (d, i) { d.classList.toggle('on', i === k); d.setAttribute('aria-current', i === k ? 'step' : 'false'); });
    caption.innerHTML = '<b>' + (k + 1) + ' / ' + N + ' · ' + s.part + '</b> &nbsp;' + s.label;
    load((k + 1) % N);
    clearTimeout(timer);
    if (playing) timer = setTimeout(demoClick, s.dwell || READ);
  }

  function jump(k) {
    clearTimeout(timer);
    load(k).then(function () {
      var o = screen(k);
      remember(o);
      Array.prototype.forEach.call(stage.querySelectorAll('.scr'), function (e) { if (e !== o.el) e.remove(); });
      settle(o);
      var l = document.getElementById('loading');
      if (l) { l.classList.add('done'); setTimeout(function () { l.remove(); }, 400); }
    });
  }

  // A to B: B fades in over A. Between two editor steps the story keeps its scroll (Figma: preserve scroll
  // position), the block B adds rises into place, then the story scrolls to it (Figma: after delay, scroll to).
  function go(b) {
    if (busy || b === undefined || b < 0 || b >= N) return;
    var A = cur, sa = A.s;
    busy = true; clearTimeout(timer);
    load(b).then(function () {
      var o = screen(b), sb = o.s, anims = [];
      remember(o);
      var keep = sa.doc && sb.doc && sb.step !== 21 && !(sa.step === 21);
      if (keep && o.wrap) o.wrap.scrollTop = Math.min(scrollOf(A), maxScroll(o)) * u;
      var fresh = keep && sb.fresh && sb.step > sa.step;
      var dur = still ? 1 : 260;
      anims.push(o.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur, easing: EASE, fill: 'both' }));
      if (fresh && !still) {   // the new block: a sprite of it rises in on top
        var r = sb.fresh, sp = document.createElement('div'), y = DOCY - scrollOf(o) + r[1];
        sp.className = 'spr'; place(sp, [DOCX + r[0], y, DOCX + r[2], y + r[3] - r[1]]); bgFor(sp, sb, 'doc', r);
        o.fx.appendChild(sp);
        anims.push(sp.animate([{ opacity: 0, transform: 'translateY(' + 18 * u + 'px)' }, { opacity: 1, transform: 'none' }], { duration: 480, delay: 120, easing: OUT, fill: 'both' }));
      }
      setTimeout(function () {
        anims[0].cancel();   // ends on its natural state even where animations were paused (a hidden tab)
        A.el.remove();
        var finish = function () { o.fx.innerHTML = ''; busy = false; settle(o); };
        if (fresh) setTimeout(function () { o.fx.innerHTML = ''; scrollTo(o, reveal(sb), 650, finish); }, still ? 0 : 380);
        else finish();
      }, still ? 10 : dur);
    });
  }

  // ---- the demo cursor ----------------------------------------------------------------------------
  function screenRect(l) {   // a link's rect on the stage, in screen px
    var r = l.rect;
    if (l.layer !== 'doc') return r;
    var dy = DOCY - scrollOf(cur);
    return [r[0] + DOCX, r[1] + dy, r[2] + DOCX, r[3] + dy];
  }
  function hoverAt(x, y) {
    cur.s.links.forEach(function (l) {
      var r = screenRect(l);
      l.el.classList.toggle('hover', x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3]);
    });
  }
  function moveTo(x, y, ms, done) {
    var x0 = mouse.x, y0 = mouse.y, t0 = performance.now();
    var cx = (x0 + x) / 2 + (y - y0) * .18, cy = (y0 + y) / 2 - (x - x0) * .18;
    (function step(now) {
      var p = Math.min(1, (now - t0) / ms), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      var bx = (1 - e) * (1 - e) * x0 + 2 * (1 - e) * e * cx + e * e * x, by = (1 - e) * (1 - e) * y0 + 2 * (1 - e) * e * cy + e * e * y;
      mouse = { x: bx, y: by };
      cursor.style.transform = 'translate(' + bx * u + 'px,' + by * u + 'px)';
      hoverAt(bx, by);
      if (p < 1) frame(step); else done();
    })(t0);
  }
  function demoClick() {
    if (!playing || busy) return;
    if (!visible || document.hidden) { timer = setTimeout(demoClick, 500); return; }
    var l = cur.s.next;
    if (!l) { jump(0); return; }   // the end: start over
    var r = screenRect(l);
    if (l.layer === 'doc' && (r[1] < DOCY + 20 || r[3] > VH - 40)) {   // below the fold: scroll it into view first
      scrollTo(cur, l.rect[1] - (VH - DOCY) / 2, 700, function () { timer = setTimeout(demoClick, 250); });
      return;
    }
    var a = [(r[0] + r[2]) / 2, (r[1] + r[3]) / 2];
    cursor.classList.add('on');
    moveTo(a[0], a[1], Math.max(450, Math.min(1100, Math.hypot(a[0] - mouse.x, a[1] - mouse.y) * 1.1)), function () {
      if (!playing) return;
      timer = setTimeout(function () {
        cursor.classList.add('down'); l.el.classList.add('press');
        var rp = document.createElement('div');
        rp.className = 'ripple'; rp.style.left = px(a[0]); rp.style.top = px(a[1]);
        stage.appendChild(rp); setTimeout(function () { rp.remove(); }, 600);
        timer = setTimeout(function () { cursor.classList.remove('down'); l.el.classList.remove('press'); go(BY[l.to]); }, 140);
      }, 220);
    });
  }

  function setPlayLabel() {
    playBtn.innerHTML = playing
      ? '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg><span>Pause demo</span>'
      : '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.2v11.6c0 .6.7 1 1.2.7l9-5.8c.5-.3.5-1 0-1.3l-9-5.9C4.7 1.2 4 1.6 4 2.2z"/></svg><span>Play demo</span>';
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function pause() {
    playing = false; cursor.classList.remove('on', 'down'); setPlayLabel();
    if (cur) cur.s.links.forEach(function (l) { l.el.classList.remove('hover', 'press'); });
    if (!busy) clearTimeout(timer);
  }
  function play() { playing = true; setPlayLabel(); if (!busy) { clearTimeout(timer); timer = setTimeout(demoClick, 300); } }

  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('restart').addEventListener('click', function () { mouse = { x: 1500, y: 1000 }; cursor.style.transform = 'translate(' + 1500 * u + 'px,' + 1000 * u + 'px)'; jump(0); });
  stage.addEventListener('click', function () {
    if (playing) { pause(); return; }
    var h = cur && cur.el.querySelector('[data-demo]');
    if (h) { h.classList.remove('hint'); void h.offsetWidth; h.classList.add('hint'); }
  });
  stage.addEventListener('wheel', function () { if (playing) pause(); }, { passive: true });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('button')) return;
    if (e.key === 'ArrowRight') { pause(); if (cur && cur.s.next) go(BY[cur.s.next.to]); else jump(0); }
    else if (e.key === 'ArrowLeft') { pause(); jump((current - 1 + N) % N); }
    else if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  });
  window.addEventListener('resize', function () {
    var y = cur ? scrollOf(cur) : 0;
    setU(); if (cur && cur.wrap) cur.wrap.scrollTop = y * u;
    cursor.style.transform = 'translate(' + mouse.x * u + 'px,' + mouse.y * u + 'px)';
  });
  if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(stage);

  setU();
  setPlayLabel();
  cursor.style.transform = 'translate(' + 1500 * u + 'px,' + 1000 * u + 'px)';
  jump(0);
})();
</script>
